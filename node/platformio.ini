[env:m5atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
extra_scripts = pre:scripts/load_env.py
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
lib_deps =
  claws/BH1750 @ ^1.3.0
  https://github.com/m5stack/M5Unit-ENV
